  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<!-- Wichtig: Die Play-CDN liest @theme NUR aus einem inline <style type="text/tailwindcss">-Block,
       eine extern verlinkte style.css wird von ihr NICHT verarbeitet.
       Deshalb Theme hier zusätzlich inline (Inhalt entspricht 1:1 style.css). -->
  <style type="text/tailwindcss">
    @theme {
      --color-sk-green: #1D4734;
      --color-sk-beige: #D4C4BA;
      --color-sk-rose: #CAA9A3;
      --color-sk-blue: #849FA8;
      --color-sk-orange: #E09B6B;
      --color-sk-cream: #E4E8E3;
      --font-sans: system-ui, sans-serif;

    }

</style>


  <link rel="stylesheet" href="style.css">
